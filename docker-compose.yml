services:
  postgres:
    image: postgres:16-alpine
    container_name: avaniis_hr_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: avaniis_hcm_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d avaniis_hcm_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  pgdata:
    name: avaniis_hr_pgdata

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>AVANIIS HR System</title>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --font-sans: 'Inter', system-ui, sans-serif;
  --font-serif: 'Fraunces', 'Times New Roman', serif;
  --font-mono: 'JetBrains Mono', ui-monospace, monospace;
  --accent-050: #EFF5F6;
  --accent-100: #D9E7E9;
  --accent-200: #B5CED2;
  --accent-500: #3E7582;
  --accent: #2E6170;
  --accent-700: #1F4A57;
  --accent-900: #0F2E38;
  --ink-1: #151A22;
  --ink-2: #3E4855;
  --ink-3: #6E7885;
  --ink-4: #A2A9B3;
  --card: #FFFFFF;
  --surface: #F5F6F8;
  --bg: #F0F2F5;
  --border: #E5E8EC;
  --nav-bg: #0F2E38;
  --nav-fg: #A8BFC6;
  --nav-fg-dim: #6D8990;
  --nav-fg-strong: #FFFFFF;
  --nav-border: rgba(255,255,255,0.06);
  --nav-active-bg: rgba(255,255,255,0.08);
  --nav-active-fg: #FFFFFF;
  --density: 1;
}
[data-density="compact"] { --density: 0.85; }
[data-accent="plum"] {
  --accent-050: #F6F1F5; --accent-100: #EADDE7; --accent-200: #D5BBCE;
  --accent-500: #85466F; --accent: #6B3458; --accent-700: #4C2440; --accent-900: #2E1527;
}
[data-accent="amber"] {
  --accent-050: #FAF3EA; --accent-100: #F2E3C9; --accent-200: #E5C896;
  --accent-500: #B07A28; --accent: #8E5E18; --accent-700: #6B4510; --accent-900: #3E2707;
}
[data-accent="forest"] {
  --accent-050: #EEF4EE; --accent-100: #D5E5D7; --accent-200: #AFCBB2;
  --accent-500: #3F7A45; --accent: #2F5D36; --accent-700: #1F4425; --accent-900: #0F2816;
}
* { box-sizing: border-box; }
body, html { margin: 0; padding: 0; height: 100%; font-family: var(--font-sans); background: var(--bg); color: var(--ink-1); -webkit-font-smoothing: antialiased; }
input, select, textarea, button { font-family: inherit; }
input::placeholder, textarea::placeholder { color: var(--ink-4); }
input[type=date] { font-family: var(--font-sans); color: var(--ink-1); }
table { font-family: var(--font-sans); }
@keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
@keyframes modalIn { from { opacity: 0; transform: translateY(8px) scale(0.98); } to { opacity: 1; transform: none; } }
@keyframes toastIn { from { opacity: 0; transform: translate(-50%, 10px); } to { opacity: 1; transform: translate(-50%, 0); } }
@keyframes slideInRight { from { opacity: 0; transform: translateX(12px); } to { opacity: 1; transform: none; } }
.page-in { animation: slideInRight .22s ease; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: #D1D5DB; border-radius: 6px; border: 2px solid transparent; background-clip: content-box; }
::-webkit-scrollbar-thumb:hover { background: #9CA3AF; background-clip: content-box; border: 2px solid transparent; }
.browser-wrap { width: 100vw; height: 100vh; padding: 22px; background: #1B2028; display: flex; align-items: stretch; justify-content: center; }

/* ── Dark mode ── */
[data-dark="true"] {
  --card: #1C2333; --surface: #151D2B; --bg: #0F1623;
  --border: #2A3548; --ink-1: #EEF2F7; --ink-2: #C0CAD8;
  --ink-3: #7A8CA0; --ink-4: #3D4E60;
  --nav-bg: #080E1A; --nav-border: rgba(255,255,255,0.07);
}
/* ── Additional themes ── */
[data-accent="midnight"] {
  --accent-050: #EEF1FA; --accent-100: #D5DDEF; --accent-200: #AABAE0;
  --accent-500: #3D5EAA; --accent: #2B4890; --accent-700: #1C3270; --accent-900: #0E1E48;
}
[data-accent="rose"] {
  --accent-050: #FDF0F4; --accent-100: #F8D8E4; --accent-200: #F0B0C8;
  --accent-500: #C05080; --accent: #A03868; --accent-700: #742650; --accent-900: #481430;
}
[data-accent="slate"] {
  --accent-050: #EFF2F6; --accent-100: #D8E0EB; --accent-200: #B0C2D8;
  --accent-500: #4A6E90; --accent: #365578; --accent-700: #243D58; --accent-900: #12253A;
}

/* ── Login page ── */
@keyframes sceneFade { 0%,100%{opacity:1} 45%{opacity:1} 55%{opacity:0} }
@keyframes slideUp { from{opacity:0;transform:translateY(18px)} to{opacity:1;transform:none} }
@keyframes pulse { 0%,100%{opacity:0.5;transform:scale(1)} 50%{opacity:1;transform:scale(1.08)} }
.login-field {
  width:100%; padding:11px 14px; border-radius:8px; font-size:14px;
  outline:none; transition:border-color .15s, box-shadow .15s;
  font-family:var(--font-sans);
}
.login-field:focus { box-shadow:0 0 0 3px var(--accent-100); border-color:var(--accent) !important; }
[data-dark="true"] .login-field:focus { box-shadow:0 0 0 3px rgba(100,160,200,0.2); }
/* ── Ken Burns pan/zoom for landing slideshow ── */
@keyframes kenBurns0 { from { transform:scale(1) translate(0,0); } to { transform:scale(1.09) translate(-1.5%,-1%); } }
@keyframes kenBurns1 { from { transform:scale(1.06) translate(1.5%,0.5%); } to { transform:scale(1) translate(0,1%); } }
@keyframes kenBurns2 { from { transform:scale(1) translate(-1%,1.5%); } to { transform:scale(1.07) translate(1%,-0.5%); } }
@keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>

<script type="text/babel">

// Chrome.jsx — Simplified Chrome browser window (dark theme, macOS)
// No dependencies, no image assets. All inline styles + inline SVG.

const CHROME_C = {
  barBg: '#202124',
  tabBg: '#35363a',
  text: '#e8eaed',
  dim: '#9aa0a6',
  urlBg: '#282a2d',
};

function ChromeTrafficLights() {
  return (
    <div style={{ display: 'flex', gap: 8, padding: '0 14px' }}>
      <div style={{ width: 12, height: 12, borderRadius: '50%', background: '#ff5f57' }} />
      <div style={{ width: 12, height: 12, borderRadius: '50%', background: '#febc2e' }} />
      <div style={{ width: 12, height: 12, borderRadius: '50%', background: '#28c840' }} />
    </div>
  );
}

// Single tab (active has curved scoops)
function ChromeTab({ title = 'New Tab', active = false }) {
  const curve = (flip) => (
    <svg width="8" height="10" viewBox="0 0 8 10"
      style={{ position: 'absolute', bottom: 0, [flip ? 'right' : 'left']: -8, transform: flip ? 'scaleX(-1)' : 'none' }}>
      <path d="M0 10C2 9 6 8 8 0V10H0Z" fill={CHROME_C.tabBg}/>
    </svg>
  );
  return (
    <div style={{
      position: 'relative', height: 34, alignSelf: 'flex-end',
      padding: '0 12px', display: 'flex', alignItems: 'center', gap: 8,
      background: active ? CHROME_C.tabBg : 'transparent',
      borderRadius: '8px 8px 0 0', minWidth: 120, maxWidth: 220,
      fontFamily: 'system-ui, sans-serif', fontSize: 12,
      color: active ? CHROME_C.text : CHROME_C.dim,
    }}>
      {active && curve(false)}
      {active && curve(true)}
      <div style={{ width: 14, height: 14, borderRadius: '50%', background: '#5f6368', flexShrink: 0 }} />
      <span style={{ flex: 1, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{title}</span>
    </div>
  );
}

function ChromeTabBar({ tabs = [{ title: 'New Tab' }], activeIndex = 0 }) {
  return (
    <div style={{
      display: 'flex', alignItems: 'center', height: 44,
      background: CHROME_C.barBg, paddingRight: 8,
    }}>
      <ChromeTrafficLights />
      <div style={{ display: 'flex', alignItems: 'flex-end', height: '100%', paddingLeft: 4, flex: 1 }}>
        {tabs.map((t, i) => <ChromeTab key={i} title={t.title} active={i === activeIndex} />)}
      </div>
    </div>
  );
}

function ChromeToolbar({ url = 'example.com' }) {
  const iconDot = (
    <div style={{
      width: 28, height: 28, display: 'flex', alignItems: 'center', justifyContent: 'center',
    }}>
      <div style={{ width: 16, height: 16, borderRadius: '50%', background: CHROME_C.dim, opacity: 0.4 }} />
    </div>
  );
  return (
    <div style={{
      height: 40, background: CHROME_C.tabBg,
      display: 'flex', alignItems: 'center', gap: 4, padding: '0 8px',
    }}>
      {iconDot}
      {/* url bar */}
      <div style={{
        flex: 1, height: 30, borderRadius: 15, background: CHROME_C.urlBg,
        display: 'flex', alignItems: 'center', gap: 8, padding: '0 14px',
        margin: '0 6px',
      }}>
        <div style={{ width: 12, height: 12, borderRadius: '50%', background: CHROME_C.dim, opacity: 0.4 }} />
        <span style={{
          flex: 1, color: CHROME_C.text, fontSize: 13,
          fontFamily: 'system-ui, sans-serif',
        }}>{url}</span>
      </div>
      {iconDot}
    </div>
  );
}

function ChromeWindow({
  tabs = [{ title: 'New Tab' }], activeIndex = 0, url = 'example.com',
  width = 900, height = 600, children,
}) {
  return (
    <div style={{
      width, height, borderRadius: 10, overflow: 'hidden',
      boxShadow: '0 24px 80px rgba(0,0,0,0.35), 0 0 0 1px rgba(0,0,0,0.1)',
      display: 'flex', flexDirection: 'column', background: CHROME_C.tabBg,
    }}>
      <ChromeTabBar tabs={tabs} activeIndex={activeIndex} />
      <ChromeToolbar url={url} />
      <div style={{ flex: 1, background: '#fff', overflow: 'auto' }}>
        {children}
      </div>
    </div>
  );
}

Object.assign(window, {
  ChromeWindow, ChromeTabBar, ChromeToolbar, ChromeTab, ChromeTrafficLights,
});

// Timesheet — current week is week of 2026-04-20 (Mon)
function mondayOf(dateStr) {
  const d = new Date(dateStr);
  const day = d.getDay(); // 0=Sun
  const diff = (day === 0 ? -6 : 1 - day);
  d.setDate(d.getDate() + diff);
  return d.toISOString().slice(0, 10);
}
function addDays(dateStr, n) {
  const d = new Date(dateStr);
  d.setDate(d.getDate() + n);
  return d.toISOString().slice(0, 10);
}

const { useState, useEffect, useMemo, useContext, createContext, useRef } = React;

// --- App state context ------------------------------------------------------
const AppCtx = createContext(null);

function AppProvider({ children, initialRole = 'employee', landingImages, setLandingImages }) {
  const [role, setRole] = useState(initialRole);
  const [route, setRoute] = useState({ page: 'dashboard', params: {} });
  const [leaves, setLeaves] = useState(LEAVES_SEED);
  const [timesheets, setTimesheets] = useState(TIMESHEETS_SEED);
  const [balances, setBalances] = useState(LEAVE_BALANCES);
  const [toast, setToast] = useState(null);

  // Current user based on role
  const currentUser = useMemo(() => {
    if (role === 'admin') return EMPLOYEES.find(e => e.id === 'e20');
    if (role === 'manager') return EMPLOYEES.find(e => e.id === 'e10');
    return EMPLOYEES.find(e => e.id === 'e01');
  }, [role]);

  function navigate(page, params = {}) { setRoute({ page, params }); }

  function showToast(msg, tone = 'info') {
    setToast({ msg, tone, id: Date.now() });
    setTimeout(() => setToast(t => (t && t.msg === msg ? null : t)), 3200);
  }

  function submitLeave(payload) {
    const id = 'l' + Math.random().toString(36).slice(2, 6);
    const days = daysBetween(payload.startDate, payload.endDate);
    const leave = {
      id, employeeId: currentUser.id, status: 'PENDING',
      submitted: new Date().toISOString().slice(0, 10),
      reviewNote: '', days, ...payload,
    };
    setLeaves(ls => [leave, ...ls]);
    showToast('Leave request submitted for approval', 'success');
  }

  function reviewLeave(id, status, reviewNote = '') {
    setLeaves(ls => ls.map(l => {
      if (l.id !== id) return l;
      if (status === 'APPROVED') {
        setBalances(b => {
          const eb = { ...(b[l.employeeId] || {}) };
          const t = eb[l.type];
          if (t) eb[l.type] = { ...t, used: t.used + l.days };
          return { ...b, [l.employeeId]: eb };
        });
      }
      return { ...l, status, reviewNote };
    }));
    showToast(status === 'APPROVED' ? 'Leave approved' : 'Leave rejected',
      status === 'APPROVED' ? 'success' : 'warn');
  }

  function updateTimesheet(id, patch) {
    setTimesheets(ts => ts.map(t => t.id === id ? { ...t, ...patch } : t));
  }
  function reviewTimesheet(id, status, reviewNote = '') {
    updateTimesheet(id, { status, reviewNote });
    showToast(status === 'APPROVED' ? 'Timesheet approved' : 'Timesheet rejected',
      status === 'APPROVED' ? 'success' : 'warn');
  }

  const value = {
    role, setRole, currentUser,
    route, navigate,
    leaves, submitLeave, reviewLeave,
    timesheets, updateTimesheet, reviewTimesheet,
    balances,
    toast, showToast,
    landingImages: landingImages || DEFAULT_LANDING_IMAGES,
    setLandingImages: setLandingImages || (() => {}),
  };
  return <AppCtx.Provider value={value}>{children}</AppCtx.Provider>;
}

const useApp = () => useContext(AppCtx);

// --- Utils ------------------------------------------------------------------
function daysBetween(a, b) {
  const d1 = new Date(a), d2 = new Date(b);
  let count = 0;
  for (let d = new Date(d1); d <= d2; d.setDate(d.getDate() + 1)) {
    const dow = d.getDay();
    if (dow !== 5 && dow !== 6) count++; // Fri/Sat weekend UAE
  }
  return count || 1;
}
function fmtDate(s) {
  if (!s) return '—';
  const d = new Date(s);
  return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
}
function fmtDateShort(s) {
  const d = new Date(s);
  return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short' });
}
function employeeById(id) { return EMPLOYEES.find(e => e.id === id); }
function deptById(id) { return DEPARTMENTS.find(d => d.id === id); }

function Avatar({ emp, size = 36, ring = false }) {
  if (!emp) return null;
  const fs = Math.round(size * 0.38);
  return (
    <div style={{
      width: size, height: size, borderRadius: '50%', background: emp.color,
      color: '#fff', display: 'flex', alignItems: 'center', justifyContent: 'center',
      fontSize: fs, fontWeight: 600, flexShrink: 0, letterSpacing: 0.2,
      boxShadow: ring ? '0 0 0 3px #fff, 0 0 0 4px ' + emp.color + '40' : 'none',
      fontFamily: 'var(--font-sans)',
    }}>{emp.initials}</div>
  );
}

// --- Toast -----------------------------------------------------------------
function Toast() {
  const { toast } = useApp();
  if (!toast) return null;
  const colors = {
    success: { bg: '#1E5B38', fg: '#fff', icon: 'check' },
    warn:    { bg: '#8A5A0B', fg: '#fff', icon: 'bell' },
    info:    { bg: '#1E3A5F', fg: '#fff', icon: 'activity' },
  };
  const c = colors[toast.tone] || colors.info;
  return (
    <div key={toast.id} style={{
      position: 'fixed', bottom: 24, left: '50%', transform: 'translateX(-50%)',
      background: c.bg, color: c.fg, padding: '12px 18px', borderRadius: 10,
      display: 'flex', alignItems: 'center', gap: 10, fontSize: 13.5, fontWeight: 500,
      boxShadow: '0 12px 32px rgba(0,0,0,0.28)', zIndex: 100,
      animation: 'toastIn .25s ease',
    }}>
      <Icon name={c.icon} size={16}/>
      {toast.msg}
    </div>
  );
}

            {insufficient && <span style={{ color: '#B33A3A', marginLeft: 8 }}> · Exceeds balance</span>}
          </span>
        </div>

        <Field label="Reason (optional)">
          <textarea value={reason} onChange={e => setReason(e.target.value)} rows="3" style={{ ...inputStyle, resize: 'vertical', fontFamily: 'var(--font-sans)' }} placeholder="Give your manager a quick note…"/>
        </Field>

        <Field label="Approver">
          <div style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '10px 12px', background: 'var(--surface)', borderRadius: 8 }}>
            <Avatar emp={employeeById(currentUser.managerId)} size={28}/>
            <div style={{ flex: 1 }}>
              <div style={{ fontSize: 13, fontWeight: 600, color: 'var(--ink-1)' }}>
                {employeeById(currentUser.managerId)?.first} {employeeById(currentUser.managerId)?.last}
              </div>
              <div style={{ fontSize: 11, color: 'var(--ink-3)' }}>{employeeById(currentUser.managerId)?.pos}</div>
            </div>
          </div>
        </Field>

        <div style={{ display: 'flex', gap: 8, justifyContent: 'flex-end', marginTop: 4 }}>
          <Btn variant="secondary" onClick={onClose}>Cancel</Btn>
          <Btn disabled={insufficient} onClick={() => !insufficient && onSubmit({ type, startDate: start, endDate: end, reason: reason || '—' })}
            style={insufficient ? { opacity: 0.5, cursor: 'not-allowed' } : {}}>
            Submit for approval
          </Btn>
        </div>
      </div>
    </Modal>
  );
}

// pages-timesheet.jsx — weekly grid + approvals

function TimesheetPage() {
  const { currentUser, timesheets, updateTimesheet, showToast } = useApp();
  const [weekStart, setWeekStart] = uState1(CURRENT_WEEK);
  const ts = timesheets.find(t => t.employeeId === currentUser.id && t.weekStart === weekStart);
  const [hours, setHours] = uState1(ts?.hours || [0,0,0,0,0,0,0]);
  uEffect1(() => { setHours(ts?.hours || [0,0,0,0,0,0,0]); }, [ts?.id]);

  const total = hours.reduce((a,b) => a+b, 0);
  const overtime = total > 45;
  const editable = !ts || ts.status === 'DRAFT' || ts.status === 'REJECTED';
  const days = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

  function shiftWeek(n) {
    const d = new Date(weekStart); d.setDate(d.getDate() + n*7);
    setWeekStart(d.toISOString().slice(0,10));
  }
  function saveDraft() {
    if (ts) updateTimesheet(ts.id, { hours, status: 'DRAFT' });
    showToast('Draft saved', 'info');
  }
  function submit() {
    if (ts) updateTimesheet(ts.id, { hours, status: 'SUBMITTED' });
    showToast('Timesheet submitted for manager review', 'success');
  }

  return (
    <div style={{ maxWidth: 1100, margin: '0 auto' }}>
      <PageHeader title="Timesheet" subtitle="Log your working hours. Submit weekly for manager approval." />

      <Card pad={0}>
        {/* Week selector */}
        <div style={{
          padding: '16px 20px', borderBottom: '1px solid var(--border)',
          display: 'flex', alignItems: 'center', gap: 14,
        }}>
          <button onClick={() => shiftWeek(-1)} style={{ ...iconBtn, width: 32, height: 32 }}><Icon name="chevron-left" size={16}/></button>
          <div style={{ flex: 1 }}>
            <div style={{ fontSize: 15, fontWeight: 700, color: 'var(--ink-1)', fontFamily: 'var(--font-serif)', letterSpacing: -0.2 }}>
              Week of {fmtDate(weekStart)}
            </div>
            <div style={{ fontSize: 12, color: 'var(--ink-3)' }}>{fmtDate(weekStart)} → {fmtDate(addDays(weekStart, 6))}</div>
          </div>
          <button onClick={() => shiftWeek(1)} style={{ ...iconBtn, width: 32, height: 32 }}><Icon name="chevron-right" size={16}/></button>
          <div style={{ width: 1, height: 28, background: 'var(--border)', margin: '0 8px' }}/>
          <Pill tone={ts?.status === 'APPROVED' ? 'approved' : ts?.status === 'SUBMITTED' ? 'submitted' : ts?.status === 'REJECTED' ? 'rejected' : 'draft'}>
            {ts?.status || 'NOT STARTED'}
          </Pill>
        </div>

        {/* Grid */}
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7, 1fr)' }}>
          {days.map((d, i) => {
            const isWeekend = i === 4 || i === 5; // Fri/Sat in UAE
            const date = addDays(weekStart, i);
            const val = hours[i];
            return (
              <div key={i} style={{
                padding: '18px 14px', borderRight: i < 6 ? '1px solid var(--border)' : 'none',
                background: isWeekend ? 'var(--surface)' : 'transparent',
                textAlign: 'center',
              }}>
                <div style={{ fontSize: 11, fontWeight: 700, color: 'var(--ink-3)', letterSpacing: 0.5, textTransform: 'uppercase' }}>{d}</div>
                <div style={{ fontSize: 12, color: 'var(--ink-4)', marginTop: 2 }}>{new Date(date).getDate()}</div>
                <input
                  type="number"
                  min="0" max="24" step="0.5"
                  disabled={!editable}
                  value={val}
                  onChange={e => {
                    const v = parseFloat(e.target.value) || 0;
                    const nh = [...hours]; nh[i] = v; setHours(nh);
                  }}
                  style={{
                    marginTop: 12, width: '100%', textAlign: 'center', border: '1px solid var(--border)',
                    borderRadius: 8, padding: '14px 4px', fontSize: 22, fontWeight: 600,
                    color: val > 0 ? 'var(--ink-1)' : 'var(--ink-4)', fontFamily: 'var(--font-serif)',
                    background: editable ? 'var(--card)' : 'var(--surface)',
                    outline: 'none',
                  }}
                />
                <div style={{ fontSize: 10, color: 'var(--ink-4)', marginTop: 4, letterSpacing: 0.3 }}>HOURS</div>
              </div>
            );
          })}
        </div>

        {/* Totals + actions */}
        <div style={{
          padding: '18px 20px', borderTop: '1px solid var(--border)',
          display: 'flex', alignItems: 'center', gap: 20, background: 'var(--surface)',
        }}>
          <div style={{ display: 'flex', alignItems: 'baseline', gap: 6 }}>
            <span style={{ fontSize: 11, fontWeight: 600, color: 'var(--ink-3)', letterSpacing: 0.4, textTransform: 'uppercase' }}>Total</span>
            <span style={{ fontSize: 24, fontWeight: 600, color: 'var(--ink-1)', fontFamily: 'var(--font-serif)', letterSpacing: -0.5 }}>{total}</span>
            <span style={{ fontSize: 13, color: 'var(--ink-3)' }}>hours</span>
          </div>
          {overtime && <Pill tone="warn">Overtime · +{(total-45).toFixed(1)}h</Pill>}
          <div style={{ flex: 1 }}/>
          {editable && (
            <>
              <Btn variant="secondary" onClick={saveDraft}>Save draft</Btn>
              <Btn icon="check" onClick={submit}>Submit for approval</Btn>
            </>
          )}
          {!editable && ts?.status === 'SUBMITTED' && (
            <span style={{ fontSize: 13, color: 'var(--ink-3)' }}>Awaiting manager review</span>
          )}
        </div>

        {ts?.reviewNote && (
          <div style={{
            padding: '14px 20px', borderTop: '1px solid var(--border)',
            background: '#FEF6E4', fontSize: 13, color: '#6B4300',
          }}>
            <strong>Manager note:</strong> {ts.reviewNote}
          </div>
        )}
      </Card>

      {/* History */}
      <div style={{ marginTop: 28 }}>
        <h3 style={{ fontSize: 14, fontWeight: 600, color: 'var(--ink-1)', marginBottom: 10, letterSpacing: -0.1 }}>Recent weeks</h3>
        <Card pad={0}>
          <table style={tableStyle}>
            <thead><tr>
              <th style={thStyle}>Week</th><th style={thStyle}>Total hours</th><th style={thStyle}>Status</th><th style={thStyle}/>
            </tr></thead>
            <tbody>
              {timesheets.filter(t => t.employeeId === currentUser.id).map(t => {
                const tot = t.hours.reduce((a,b)=>a+b,0);
                return (
                  <tr key={t.id} style={{ borderTop: '1px solid var(--border)' }}>
                    <td style={tdStyle}><strong>{fmtDate(t.weekStart)}</strong></td>
                    <td style={tdStyle}>{tot}h {tot > 45 && <span style={{ color: '#8A5A0B', marginLeft: 6 }}>· OT</span>}</td>
                    <td style={tdStyle}>
                      <Pill tone={t.status === 'APPROVED' ? 'approved' : t.status === 'SUBMITTED' ? 'submitted' : t.status === 'REJECTED' ? 'rejected' : 'draft'}>
                        {t.status}
                      </Pill>
                    </td>
                    <td style={{ ...tdStyle, textAlign: 'right' }}>
                      <button onClick={() => setWeekStart(t.weekStart)} style={linkBtn}>Open <Icon name="chevron-right" size={12}/></button>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </Card>
      </div>
    </div>
  );
}

function Kpi({ icon, label, value, sub, tone, onClick }) {

function ApprovalsPage() {
  const { currentUser, leaves, timesheets, reviewLeave, reviewTimesheet } = useApp();
  const team = EMPLOYEES.filter(e => e.managerId === currentUser.id);
  const [tab, setTab] = uState1('leave');
  const [rejecting, setRejecting] = uState1(null);

  const pendingLeaves = leaves.filter(l => l.status === 'PENDING' && team.some(t => t.id === l.employeeId));
  const pendingTs = timesheets.filter(t => t.status === 'SUBMITTED' && team.some(m => m.id === t.employeeId));

  return (
    <div style={{ maxWidth: 1100, margin: '0 auto' }}>
      <PageHeader title="Approvals" subtitle={`${pendingLeaves.length + pendingTs.length} items awaiting your review`}/>

      <div style={{ display: 'flex', gap: 4, marginBottom: 16, borderBottom: '1px solid var(--border)' }}>
        {[['leave', 'Leave requests', pendingLeaves.length], ['ts', 'Timesheets', pendingTs.length]].map(([k, l, c]) => (
          <button key={k} onClick={() => setTab(k)} style={{
            padding: '10px 14px', background: 'transparent', border: 0, cursor: 'pointer',
            fontSize: 13, fontWeight: 600, color: tab === k ? 'var(--ink-1)' : 'var(--ink-3)',
            borderBottom: tab === k ? '2px solid var(--accent)' : '2px solid transparent', marginBottom: -1,
          }}>{l} <span style={{ background: c > 0 ? 'var(--accent)' : 'var(--border)', color: c > 0 ? '#fff' : 'var(--ink-3)', fontSize: 11, padding: '1px 8px', borderRadius: 999, marginLeft: 6 }}>{c}</span></button>
        ))}
      </div>

      {tab === 'leave' && (
        <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
          {pendingLeaves.length === 0 && <EmptyState icon="check" title="No leave requests" body="You're all caught up on leave approvals."/>}
          {pendingLeaves.map(l => {
            const emp = employeeById(l.employeeId);
            const bal = balancesRemaining(emp.id, l.type);
            return (
              <div key={l.id} style={{ background: 'var(--card)', border: '1px solid var(--border)', borderRadius: 12, padding: 20 }}>
                <div style={{ display: 'flex', alignItems: 'flex-start', gap: 16 }}>
                  <Avatar emp={emp} size={44}/>
                  <div style={{ flex: 1 }}>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                      <span style={{ fontSize: 15, fontWeight: 600, color: 'var(--ink-1)' }}>{emp.first} {emp.last}</span>
                      <span style={{ fontSize: 12, color: 'var(--ink-3)' }}>· {emp.pos}</span>
                    </div>
                    <div style={{ display: 'flex', gap: 24, marginTop: 12, flexWrap: 'wrap' }}>
                      <LeaveStat label="Type" value={<span style={{ display:'inline-flex',alignItems:'center',gap:6 }}><span style={{ width:8, height:8, borderRadius:2, background: LEAVE_TYPES[l.type].color }}/>{LEAVE_TYPES[l.type].label}</span>}/>
                      <LeaveStat label="Dates" value={`${fmtDate(l.startDate)} → ${fmtDate(l.endDate)}`}/>
                      <LeaveStat label="Days" value={<strong>{l.days}</strong>}/>
                      <LeaveStat label="Balance after" value={bal !== null ? `${bal - l.days} / ${bal}` : '—'}/>
                      <LeaveStat label="Submitted" value={fmtDate(l.submitted)}/>
                    </div>
                    <div style={{
                      marginTop: 14, padding: '10px 14px', background: 'var(--surface)', borderRadius: 8,
                      fontSize: 13, color: 'var(--ink-2)', borderLeft: '3px solid var(--accent)',
                    }}>
                      <span style={{ fontWeight: 600, color: 'var(--ink-3)', marginRight: 6 }}>Reason:</span>
                      {l.reason}
                    </div>
                  </div>
                  <div style={{ display: 'flex', flexDirection: 'column', gap: 8, minWidth: 140 }}>
                    <Btn variant="success" icon="check" onClick={() => reviewLeave(l.id, 'APPROVED')}>Approve</Btn>
                    <Btn variant="danger" icon="x" onClick={() => setRejecting(l)}>Reject</Btn>
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      )}

      {tab === 'ts' && (
        <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
          {pendingTs.length === 0 && <EmptyState icon="check" title="No timesheets pending" body="Your team has no timesheets awaiting review."/>}
          {pendingTs.map(t => {
            const emp = employeeById(t.employeeId);
            const tot = t.hours.reduce((a,b)=>a+b,0);
            return (
              <div key={t.id} style={{ background: 'var(--card)', border: '1px solid var(--border)', borderRadius: 12, padding: 20 }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: 14 }}>
                  <Avatar emp={emp} size={40}/>
                  <div style={{ flex: 1 }}>
                    <div style={{ fontSize: 14, fontWeight: 600, color: 'var(--ink-1)' }}>{emp.first} {emp.last}</div>
                    <div style={{ fontSize: 12, color: 'var(--ink-3)' }}>Week of {fmtDate(t.weekStart)} · <strong>{tot}h</strong> {tot > 45 && <span style={{ color: '#8A5A0B' }}>· Overtime</span>}</div>
                  </div>
                  <Btn variant="success" icon="check" size="sm" onClick={() => reviewTimesheet(t.id, 'APPROVED')}>Approve</Btn>
                  <Btn variant="danger" icon="x" size="sm" onClick={() => reviewTimesheet(t.id, 'REJECTED', 'Please adjust and resubmit.')}>Reject</Btn>
                </div>
                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7, 1fr)', gap: 6, marginTop: 14 }}>
                  {['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map((d, i) => (
                    <div key={i} style={{
                      padding: 10, textAlign: 'center', background: 'var(--surface)', borderRadius: 6,
                      opacity: (i === 4 || i === 5) ? 0.6 : 1,
                    }}>
                      <div style={{ fontSize: 10, color: 'var(--ink-3)', fontWeight: 600, letterSpacing: 0.3 }}>{d.toUpperCase()}</div>
                      <div style={{ fontSize: 16, fontWeight: 600, color: t.hours[i] > 0 ? 'var(--ink-1)' : 'var(--ink-4)', fontFamily: 'var(--font-serif)', marginTop: 2 }}>{t.hours[i]}</div>
                    </div>
                  ))}
                </div>
              </div>
            );
          })}
        </div>
      )}

      {rejecting && <RejectModal leave={rejecting} onClose={() => setRejecting(null)} onConfirm={(note) => { reviewLeave(rejecting.id, 'REJECTED', note); setRejecting(null); }}/>}
    </div>
  );
}

function balancesRemaining(empId, type) {
  const b = window.LEAVE_BALANCES[empId]?.[type];
  return b ? b.total - b.used : null;
}

function LeaveStat({ label, value }) {
  return (
    <div>
      <div style={{ fontSize: 10.5, fontWeight: 600, color: 'var(--ink-3)', letterSpacing: 0.5, textTransform: 'uppercase' }}>{label}</div>
      <div style={{ fontSize: 13, color: 'var(--ink-1)', marginTop: 3 }}>{value}</div>
    </div>
  );
}

function EmptyState({ icon, title, body }) {
  return (
    <div style={{ padding: 60, textAlign: 'center', background: 'var(--card)', border: '1px solid var(--border)', borderRadius: 12 }}>
      <div style={{ width: 48, height: 48, borderRadius: '50%', background: 'var(--accent-100)', color: 'var(--accent-700)', display: 'grid', placeItems: 'center', margin: '0 auto 14px' }}>
        <Icon name={icon} size={20}/>
      </div>
      <div style={{ fontSize: 15, fontWeight: 600, color: 'var(--ink-1)', fontFamily: 'var(--font-serif)', letterSpacing: -0.2 }}>{title}</div>
      <div style={{ fontSize: 13, color: 'var(--ink-3)', marginTop: 6 }}>{body}</div>
    </div>
  );
}

function RejectModal({ leave, onClose, onConfirm }) {
  const [note, setNote] = uState1('');
  return (
    <Modal title="Reject leave request" onClose={onClose}>
      <div style={{ fontSize: 13.5, color: 'var(--ink-2)', marginBottom: 14 }}>
        Rejecting <strong>{employeeById(leave.employeeId)?.first}'s</strong> {LEAVE_TYPES[leave.type].label.toLowerCase()} leave request ({leave.days} days). A reason is required.
      </div>
      <Field label="Reason for rejection">
        <textarea value={note} onChange={e => setNote(e.target.value)} rows="3" style={{ ...inputStyle, resize: 'vertical', fontFamily: 'var(--font-sans)' }} placeholder="Explain so they can plan next steps…"/>
      </Field>
      <div style={{ display: 'flex', gap: 8, justifyContent: 'flex-end', marginTop: 16 }}>
        <Btn variant="secondary" onClick={onClose}>Cancel</Btn>
        <Btn variant="danger" disabled={!note.trim()} onClick={() => note.trim() && onConfirm(note)} style={!note.trim() ? { opacity: 0.5 } : {}}>Reject request</Btn>
      </div>
    </Modal>
  );
}

// ── Landing Visuals admin page ────────────────────────────────────────────────
function LandingImagesPage() {
  const { landingImages, setLandingImages } = useApp();
  const [dragging, setDragging] = React.useState(false);
  const [uploading, setUploading] = React.useState(false);
  const inputRef = React.useRef();

  function readFiles(files) {
    if (!files || files.length === 0) return;
    setUploading(true);
    const readers = Array.from(files).filter(f => f.type.startsWith('image/')).map(file =>
      new Promise(resolve => {
        const r = new FileReader();
        r.onload = e => resolve({
          src: e.target.result,
          alt: file.name.replace(/\.[^.]+$/, '').replace(/[-_]/g, ' '),
          id: 'up-' + Date.now() + '-' + Math.random().toString(36).slice(2,6),
        });
        r.readAsDataURL(file);
      })
    );
    Promise.all(readers).then(newImgs => {
      setLandingImages([...landingImages, ...newImgs]);
      setUploading(false);
    });
  }

  function removeImage(id) {
    const next = landingImages.filter(i => i.id !== id);
    setLandingImages(next.length > 0 ? next : DEFAULT_LANDING_IMAGES);
  }

  function moveImage(id, dir) {
    const idx = landingImages.findIndex(i => i.id === id);
    if (idx < 0) return;
    const next = [...landingImages];
    const swap = idx + dir;
    if (swap < 0 || swap >= next.length) return;
    [next[idx], next[swap]] = [next[swap], next[idx]];
    setLandingImages(next);
  }

  function resetDefaults() {
    setLandingImages(DEFAULT_LANDING_IMAGES);
  }

  function onDrop(e) {
    e.preventDefault(); setDragging(false);
    readFiles(e.dataTransfer.files);
  }

  return (
    <div style={{ maxWidth: 900, margin: '0 auto' }}>
      <PageHeader
        title="Landing Visuals"
        subtitle="Manage the background images shown on the sign-in page. Supports any image format."
        actions={
          <div style={{ display:'flex', gap:8 }}>
            <Btn variant="secondary" onClick={resetDefaults}>Reset to defaults</Btn>
            <Btn icon="upload" onClick={() => inputRef.current?.click()} disabled={uploading}>
              {uploading ? 'Uploading…' : 'Upload images'}
            </Btn>
            <input ref={inputRef} type="file" accept="image/*" multiple style={{ display:'none' }}
              onChange={e => readFiles(e.target.files)}/>
          </div>
        }
      />

      {/* Drop zone */}
      <div
        onDragOver={e => { e.preventDefault(); setDragging(true); }}
        onDragLeave={() => setDragging(false)}
        onDrop={onDrop}
        onClick={() => inputRef.current?.click()}
        style={{
          border: `2px dashed ${dragging ? 'var(--accent)' : 'var(--border)'}`,
          borderRadius: 12, padding: '28px 24px', textAlign: 'center', cursor: 'pointer',
          background: dragging ? 'var(--accent-050)' : 'var(--surface)',
          transition: 'all .15s', marginBottom: 24,
        }}
      >
        <Icon name="upload" size={28} style={{ color: dragging ? 'var(--accent)' : 'var(--ink-4)', marginBottom: 10 }}/>
        <div style={{ fontSize: 14, fontWeight: 600, color: dragging ? 'var(--accent)' : 'var(--ink-2)' }}>
          {dragging ? 'Drop to upload' : 'Drag & drop images here, or click to browse'}
        </div>
        <div style={{ fontSize: 12, color: 'var(--ink-4)', marginTop: 4 }}>
          JPG, PNG, WebP · Max 10MB each · Multiple files accepted
        </div>
      </div>

      {/* Image grid */}
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(240px, 1fr))', gap: 16, marginBottom: 24 }}>
        {landingImages.map((img, idx) => (
          <div key={img.id} style={{
            border: '1px solid var(--border)', borderRadius: 12, overflow: 'hidden',
            background: 'var(--card)', position: 'relative',
          }}>
            {/* Preview */}
            <div style={{ position: 'relative', height: 160 }}>
              <img src={img.src} alt={img.alt}
                style={{ width:'100%', height:'100%', objectFit:'cover', objectPosition:'center', display:'block' }}/>
              {/* Slide number badge */}
              <div style={{
                position:'absolute', top:10, left:10, background:'rgba(0,0,0,0.6)',
                color:'#fff', fontSize:11, fontWeight:700, borderRadius:20,
                padding:'2px 9px', backdropFilter:'blur(4px)',
              }}>#{idx + 1}</div>
              {/* Delete */}
              <button onClick={() => removeImage(img.id)} style={{
                position:'absolute', top:8, right:8, width:28, height:28,
                borderRadius:'50%', background:'rgba(0,0,0,0.55)', border:0, cursor:'pointer',
                color:'#fff', display:'grid', placeItems:'center', backdropFilter:'blur(4px)',
              }}>
                <Icon name="x" size={14}/>
              </button>
            </div>

            {/* Caption + order controls */}
            <div style={{ padding:'10px 14px', display:'flex', alignItems:'center', gap:8 }}>
              <div style={{ flex:1, fontSize:12.5, color:'var(--ink-2)', fontWeight:500, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>
                {img.alt}
              </div>
              <button onClick={() => moveImage(img.id, -1)} disabled={idx === 0} style={{
                padding:'4px 8px', border:'1px solid var(--border)', borderRadius:6,
                background:'var(--card)', cursor: idx === 0 ? 'not-allowed' : 'pointer',
                opacity: idx === 0 ? 0.4 : 1, color:'var(--ink-3)',
              }}><Icon name="chevron-left" size={12}/></button>
              <button onClick={() => moveImage(img.id, 1)} disabled={idx === landingImages.length - 1} style={{
                padding:'4px 8px', border:'1px solid var(--border)', borderRadius:6,
                background:'var(--card)', cursor: idx === landingImages.length - 1 ? 'not-allowed' : 'pointer',
                opacity: idx === landingImages.length - 1 ? 0.4 : 1, color:'var(--ink-3)',
              }}><Icon name="chevron-right" size={12}/></button>
            </div>
          </div>
        ))}
      </div>

      {/* Info notice */}
      <div style={{ padding:'14px 18px', background:'var(--accent-050)', borderRadius:10, border:'1px solid var(--accent-100)', display:'flex', gap:12, alignItems:'flex-start' }}>
        <Icon name="info" size={16} style={{ color:'var(--accent-700)', flexShrink:0, marginTop:1 }}/>
        <div style={{ fontSize:12.5, color:'var(--accent-700)', lineHeight:1.6 }}>
          <strong>How it works:</strong> Uploaded images are stored in your browser and used immediately on the sign-in page.
          Images auto-transition every 7 seconds with a cinematic Ken Burns zoom effect. Reorder with the arrows to control the sequence.
          Changes persist across sessions in this browser.
        </div>
      </div>
    </div>
  );
}

              <div key={i} style={{
                height: 3, borderRadius: 99,
                background: 'rgba(255,255,255,0.9)',
                flex: i === scene ? 3 : 1,
                opacity: i === scene ? 1 : 0.3,
                transition: 'all 0.5s ease',
                cursor: 'pointer',
              }} onClick={() => setScene(i)}/>
            ))}
          </div>
        </div>

        {/* Cinematic vignette — covers the image but sits below UI */}
        <div style={{ position:'absolute', inset:0, pointerEvents:'none', zIndex:10,
          background:'linear-gradient(to top, rgba(6,12,20,0.88) 0%, rgba(6,12,20,0.2) 45%, rgba(6,12,20,0.28) 100%)',
        }}/>
      </div>

      {/* ── RIGHT: Login panel ── */}
      <div style={{ width:440, flexShrink:0, background:cardBg, display:'flex', flexDirection:'column', justifyContent:'space-between', boxShadow:'-8px 0 60px rgba(0,0,0,0.35)', position:'relative', zIndex:20, overflowY:'auto' }}>

        {/* Top bar with controls */}
        <div style={{ padding:'24px 36px 0', display:'flex', alignItems:'center', justifyContent:'space-between' }}>
          {/* Language toggle */}
          <div style={{ display:'flex', alignItems:'center', gap:0, background: darkMode ? 'rgba(255,255,255,0.06)' : '#F0F2F5', borderRadius:7, overflow:'hidden' }}>
            {['en','ar'].map(l => (
              <button key={l} onClick={() => setLang(l)} style={{
                padding:'6px 12px', fontSize:12, fontWeight:600, border:0, cursor:'pointer',
                background: lang===l ? 'var(--accent)' : 'transparent',
                color: lang===l ? '#fff' : ink2,
                transition:'all .15s',
              }}>{l==='en' ? 'EN' : 'عربي'}</button>
            ))}
          </div>

          {/* Dark/light toggle */}
          <button onClick={() => setDarkMode(!darkMode)} style={{
            display:'flex', alignItems:'center', gap:6, padding:'6px 12px',
            background: darkMode ? 'rgba(255,255,255,0.07)' : '#F0F2F5',
            border:'none', borderRadius:7, cursor:'pointer', fontSize:12, fontWeight:600, color:ink2,
          }}>
            {darkMode ? (
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
            ) : (
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
            )}
            {darkMode ? t.light : t.dark}
          </button>
        </div>

        {/* Login form */}
        <div style={{ padding:'0 36px', flex:1, display:'flex', flexDirection:'column', justifyContent:'center', gap:0 }}>
          <div style={{ marginBottom:32 }}>
            <div style={{ fontSize:26, fontWeight:600, color:ink1, fontFamily:'var(--font-serif)', letterSpacing:-0.5, marginBottom:6 }}>{t.welcome}</div>
            <div style={{ fontSize:13.5, color:ink2 }}>{t.subtitle}</div>
          </div>

          <form onSubmit={handleSignIn} style={{ display:'flex', flexDirection:'column', gap:18 }}>
            {/* Email */}
            <div style={{ display:'flex', flexDirection:'column', gap:6 }}>
              <label style={{ fontSize:11.5, fontWeight:600, color:ink2, letterSpacing:0.4, textTransform:'uppercase' }}>{t.emailLabel}</label>
              <input
                className="login-field"
                type="email" required
                placeholder={t.emailPh}
                value={email}
                onChange={e => { setEmail(e.target.value); setError(''); }}
                style={{ background:inputBg, border:`1.5px solid ${inputBdr}`, color:ink1 }}
              />
            </div>

            {/* Password */}
            <div style={{ display:'flex', flexDirection:'column', gap:6 }}>
              <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center' }}>
                <label style={{ fontSize:11.5, fontWeight:600, color:ink2, letterSpacing:0.4, textTransform:'uppercase' }}>{t.passLabel}</label>
                <button type="button" style={{ fontSize:12, color:'var(--accent)', background:'none', border:0, cursor:'pointer', fontWeight:500 }}>{t.forgot}</button>
              </div>
              <div style={{ position:'relative' }}>
                <input
                  className="login-field"
                  type={showPass ? 'text' : 'password'} required
                  placeholder={t.passPh}
                  value={password}
                  onChange={e => setPassword(e.target.value)}
                  style={{ background:inputBg, border:`1.5px solid ${inputBdr}`, color:ink1, paddingRight:42 }}
                />
                <button type="button" onClick={() => setShowPass(!showPass)} style={{
                  position:'absolute', right:12, top:'50%', transform:'translateY(-50%)',
                  background:'none', border:0, cursor:'pointer', color:ink2, display:'grid', placeItems:'center',
                }}>
                  {showPass
                    ? <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24M1 1l22 22"/></svg>
                    : <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                  }
                </button>
              </div>
            </div>

            {/* Error */}
            {error && (
              <div style={{ padding:'10px 14px', background:'rgba(180,50,50,0.1)', border:'1px solid rgba(180,50,50,0.3)', borderRadius:8, fontSize:12.5, color:'#C03030', lineHeight:1.5 }}>
                {error}
              </div>
            )}

            {/* Sign In button */}
            <button type="submit" disabled={signing} style={{
              padding:'12px', fontSize:14, fontWeight:700, letterSpacing:0.3,
              background:'var(--accent)', color:'#fff', border:'none', borderRadius:9,
              cursor:signing ? 'not-allowed' : 'pointer', opacity:signing ? 0.75 : 1,
              boxShadow:'0 6px 24px rgba(0,0,0,0.25)', transition:'all .15s',
              display:'flex', alignItems:'center', justifyContent:'center', gap:8,
            }}>
              {signing && <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2.5" strokeLinecap="round" style={{ animation:'spin 0.8s linear infinite' }}><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>}
              {signing ? t.signing : t.signIn}
            </button>
          </form>

          {/* Divider + Demo accounts */}
          <div style={{ marginTop:28 }}>
            <div style={{ display:'flex', alignItems:'center', gap:10, marginBottom:16 }}>
              <div style={{ flex:1, height:1, background:divClr }}/>
              <button onClick={() => setShowDemoHint(!showDemoHint)} style={{
                fontSize:11.5, color:ink2, background:'none', border:`1px solid ${divClr}`,
                borderRadius:99, padding:'3px 12px', cursor:'pointer', fontWeight:500,
              }}>{t.demoTitle}</button>
              <div style={{ flex:1, height:1, background:divClr }}/>
            </div>

            {showDemoHint && (
              <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
                <div style={{ fontSize:11, color:ink2, marginBottom:4 }}>{t.demoHint}</div>
                {demoAccounts.map(d => (
                  <button key={d.email} onClick={() => { setEmail(d.email); setPassword('demo1234'); setShowDemoHint(false); }} style={{
                    display:'flex', alignItems:'center', gap:10, padding:'9px 12px',
                    background: darkMode ? 'rgba(255,255,255,0.05)' : '#F6F8FA',
                    border:`1px solid ${divClr}`, borderRadius:8, cursor:'pointer', textAlign:t.dir==='rtl'?'right':'left',
                  }}>
                    <div style={{ width:28, height:28, borderRadius:'50%', background:'var(--accent)', color:'#fff', display:'grid', placeItems:'center', fontSize:10, fontWeight:700, flexShrink:0 }}>
                      {d.name.split(' ').map(n=>n[0]).join('').slice(0,2)}
                    </div>
                    <div style={{ flex:1, minWidth:0 }}>
                      <div style={{ fontSize:12.5, fontWeight:600, color:ink1 }}>{d.name}</div>
                      <div style={{ fontSize:11, color:ink2, fontFamily:'var(--font-mono)' }}>{d.email}</div>
                    </div>
                    <div style={{ fontSize:10, fontWeight:600, color:'var(--accent)', letterSpacing:0.5, textTransform:'uppercase',
                      background:'var(--accent-100)', padding:'2px 8px', borderRadius:99 }}>{d.role}</div>
                  </button>
                ))}
              </div>
            )}
          </div>

          {/* Theme picker */}
          <div style={{ marginTop:28 }}>
            <div style={{ fontSize:11, fontWeight:600, color:ink2, letterSpacing:0.5, textTransform:'uppercase', marginBottom:10 }}>{t.colorTheme}</div>
            <div style={{ display:'flex', flexWrap:'wrap', gap:8 }}>
              {THEMES.map(th => (
                <button key={th.id} onClick={() => setAccent(th.id)} title={th.label} style={{
                  width:28, height:28, borderRadius:7, background:th.color, border:0, cursor:'pointer',
                  outline: accent===th.id ? `2.5px solid ${th.color}` : '2px solid transparent',
                  outlineOffset:2.5, transition:'all .15s',
                  boxShadow: accent===th.id ? `0 0 0 4px ${th.color}30` : 'none',
                }}/>
              ))}
            </div>
            <div style={{ fontSize:11, color:ink2, marginTop:6, opacity:0.6 }}>
              {THEMES.find(t=>t.id===accent)?.label}
            </div>
          </div>
        </div>

        {/* Footer */}
        <div style={{ padding:'20px 36px', borderTop:`1px solid ${divClr}` }}>
          <div style={{ fontSize:11, color:ink2, opacity:0.6, textAlign:'center' }}>{t.footer}</div>
        </div>
      </div>

      {/* Spin animation */}
      <style>{`@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}`}</style>
    </div>
  );
}


function Router() {
  const { role, route } = useApp();
  let page;
  if (route.page === 'employee-detail') page = <EmployeeDetailPage id={route.params?.id}/>;
  else if (role === 'employee') {
    if (route.page === 'dashboard') page = <EmployeeDashboard/>;
    else if (route.page === 'leave') page = <LeavePage/>;
    else if (route.page === 'timesheet') page = <TimesheetPage/>;
    else if (route.page === 'directory') page = <DirectoryPage/>;
    else if (route.page === 'profile') page = <EmployeeDetailPage id={null}/>;
    else page = <EmployeeDashboard/>;
  } else if (role === 'manager') {
    if (route.page === 'dashboard') page = <ManagerDashboard/>;
    else if (route.page === 'approvals') page = <ApprovalsPage/>;
    else if (route.page === 'team') page = <TeamPage/>;
    else if (route.page === 'leave') page = <LeavePage/>;
    else if (route.page === 'timesheet') page = <TimesheetPage/>;
    else if (route.page === 'directory') page = <DirectoryPage/>;
    else page = <ManagerDashboard/>;
  } else {
    if (route.page === 'dashboard') page = <AdminDashboard/>;
    else if (route.page === 'users') page = <UsersPage/>;
    else if (route.page === 'employees') page = <EmployeesAdminPage/>;
    else if (route.page === 'assignments') page = <AssignmentsPage/>;
    else if (route.page === 'leave-admin') page = <LeavePage/>;
    else if (route.page === 'timesheet-admin') page = <TimesheetPage/>;
    else if (route.page === 'reports') page = <ReportsPage/>;
    else if (route.page === 'landing-images') page = <LandingImagesPage/>;
    else if (route.page === 'settings') page = <SettingsPage/>;
    else page = <AdminDashboard/>;
  }
  return <div key={role + '/' + route.page} className="page-in" style={{ padding: 'calc(28px * var(--density))' }}>{page}</div>;
}

function TweaksPanel({ onClose, accent, setAccent, density, setDensity, sidebarCollapsed, setSidebarCollapsed }) {
  const { role, setRole } = useApp();
  const tLabel = { fontSize: 10.5, fontWeight: 600, color: 'var(--ink-3)', letterSpacing: 0.4, textTransform: 'uppercase' };
  return (
    <div style={{
      position: 'fixed', top: 80, right: 20, width: 280, background: 'var(--card)',
      border: '1px solid var(--border)', borderRadius: 14, zIndex: 60,
      boxShadow: '0 24px 60px rgba(0,0,0,0.18)', overflow: 'hidden',
    }}>
      <div style={{ padding: '14px 18px', borderBottom: '1px solid var(--border)', display: 'flex', alignItems: 'center', gap: 8 }}>
        <Icon name="tweaks" size={15} style={{ color: 'var(--accent)' }}/>
        <span style={{ fontSize: 13.5, fontWeight: 600, color: 'var(--ink-1)', flex: 1, fontFamily: 'var(--font-serif)', letterSpacing: -0.1 }}>Tweaks</span>
        <button onClick={onClose} style={{ ...iconBtn, width: 28, height: 28, border: 0 }}><Icon name="x" size={14}/></button>
      </div>
      <div style={{ padding: 18, display: 'flex', flexDirection: 'column', gap: 18 }}>
        <div>
          <div style={tLabel}>Role</div>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 6, marginTop: 8 }}>
            {['employee', 'manager', 'admin'].map(r => (
              <button key={r} onClick={() => setRole(r)} style={{
                padding: '8px 6px', fontSize: 11.5, fontWeight: 600, textTransform: 'capitalize',
                borderRadius: 7, cursor: 'pointer',
                border: '1px solid ' + (role === r ? 'var(--accent)' : 'var(--border)'),
                background: role === r ? 'var(--accent-100)' : 'var(--card)',
                color: role === r ? 'var(--accent-700)' : 'var(--ink-2)',
              }}>{r}</button>
            ))}
          </div>
        </div>
        <div>
          <div style={tLabel}>Accent color</div>
          <div style={{ display: 'flex', gap: 8, marginTop: 8 }}>
            {[['teal', '#2E6170'], ['plum', '#6B3458'], ['amber', '#8E5E18'], ['forest', '#2F5D36']].map(([k, c]) => (
              <button key={k} onClick={() => setAccent(k)} title={k} style={{
                width: 34, height: 34, borderRadius: 10, background: c, border: 0, cursor: 'pointer',
                outline: accent === k ? '2px solid ' + c : 'none', outlineOffset: 2,
              }}/>
            ))}
          </div>
        </div>
        <div>
          <div style={tLabel}>Density</div>
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 6, marginTop: 8 }}>
            {['comfortable', 'compact'].map(d => (
              <button key={d} onClick={() => setDensity(d)} style={{
                padding: '8px 10px', fontSize: 12, fontWeight: 600, textTransform: 'capitalize',
                borderRadius: 7, cursor: 'pointer',
                border: '1px solid ' + (density === d ? 'var(--accent)' : 'var(--border)'),
                background: density === d ? 'var(--accent-100)' : 'var(--card)',
                color: density === d ? 'var(--accent-700)' : 'var(--ink-2)',
              }}>{d}</button>
            ))}
          </div>
        </div>
        <div>
          <div style={tLabel}>Sidebar</div>
          <label style={{ display: 'flex', alignItems: 'center', gap: 10, marginTop: 10, fontSize: 13, color: 'var(--ink-2)' }}>
            <input type="checkbox" checked={sidebarCollapsed} onChange={e => setSidebarCollapsed(e.target.checked)}/>
            Collapsed
          </label>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [loggedIn, setLoggedIn] = React.useState(false);
  const [loginRole, setLoginRole] = React.useState(TWEAK_DEFAULTS.role);
  const [accent, setAccentState] = React.useState(TWEAK_DEFAULTS.accent);
  const [density, setDensityState] = React.useState(TWEAK_DEFAULTS.density);
  const [sidebarCollapsed, setSidebarCollapsedState] = React.useState(TWEAK_DEFAULTS.sidebarCollapsed);
  const [tweaksOpen, setTweaksOpen] = React.useState(false);
  const [darkMode, setDarkMode] = React.useState(false);
  const [lang, setLang] = React.useState('en');
  const [landingImages, setLandingImagesState] = React.useState(() => {
    try {
      const s = localStorage.getItem('avaniis_landing_images');
      return s ? JSON.parse(s) : DEFAULT_LANDING_IMAGES;
    } catch { return DEFAULT_LANDING_IMAGES; }
  });
  function setLandingImages(imgs) {
    setLandingImagesState(imgs);
    try { localStorage.setItem('avaniis_landing_images', JSON.stringify(imgs)); } catch {}
  }

  React.useEffect(() => { document.body.setAttribute('data-accent', accent); }, [accent]);
  React.useEffect(() => { document.body.setAttribute('data-density', density); }, [density]);
  React.useEffect(() => { document.body.setAttribute('data-dark', darkMode); }, [darkMode]);
  React.useEffect(() => { document.documentElement.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr'); }, [lang]);

  const setAccent = (v) => setAccentState(v);
  const setDensity = (v) => setDensityState(v);
  const setSidebarCollapsed = (v) => setSidebarCollapsedState(v);

  if (!loggedIn) {
    return (
      <LoginPage
        onLogin={(role) => { setLoginRole(role); setLoggedIn(true); }}
        accent={accent} setAccent={setAccent}
        darkMode={darkMode} setDarkMode={setDarkMode}
        lang={lang} setLang={setLang}
        landingImages={landingImages}
      />
    );
  }

  return (
    <AppProvider initialRole={loginRole} landingImages={landingImages} setLandingImages={setLandingImages}>
      <div className="browser-wrap">
        <ChromeWindow
          tabs={[{ title: 'AVANIIS HR System' }, { title: 'Calendar' }, { title: 'Docs' }]}
          activeIndex={0}
          url="people.avaniis.ae/dashboard"
          width="100%"
          height="100%"
        >
          <div style={{ display: 'flex', height: '100%', background: 'var(--bg)' }}>
            <Sidebar collapsed={sidebarCollapsed}/>
            <div style={{ flex: 1, display: 'flex', flexDirection: 'column', minWidth: 0 }}>
              <TopbarWithTweaks
                onToggleSidebar={() => setSidebarCollapsed(!sidebarCollapsed)}
                onToggleTweaks={() => setTweaksOpen(o => !o)}
                onSignOut={() => setLoggedIn(false)}
              />
              <main style={{ flex: 1, overflow: 'auto' }}>
                <Router/>
              </main>
            </div>
          </div>
        </ChromeWindow>
        {tweaksOpen && (
          <TweaksPanel
            onClose={() => setTweaksOpen(false)}
            accent={accent} setAccent={setAccent}
            density={density} setDensity={setDensity}
            sidebarCollapsed={sidebarCollapsed} setSidebarCollapsed={setSidebarCollapsed}
          />
        )}
        <Toast/>
      </div>
    </AppProvider>
  );
}

function TopbarWithTweaks({ onToggleSidebar, onToggleTweaks, onSignOut }) {
  const { currentUser, role, navigate, route } = useApp();
  const crumbs = React.useMemo(() => {
    const map = {
      dashboard: role === 'admin' ? 'Overview' : role === 'manager' ? 'Team Overview' : 'Home',
      leave: 'My Leave', timesheet: 'Timesheet', directory: 'Directory', profile: 'My Profile',
      approvals: 'Approvals', team: 'My Team',
      users: 'Users & Roles', employees: 'Employees', assignments: 'Assignments',
      'leave-admin': 'Leave', 'timesheet-admin': 'Timesheets', reports: 'Reports', 'landing-images': 'Landing Visuals', settings: 'Settings',
      'employee-detail': 'Employee',
    };
    return [map[route.page] || route.page];
  }, [route, role]);

  return (
    <header style={{
      height: 64, background: 'var(--card)', borderBottom: '1px solid var(--border)',
      display: 'flex', alignItems: 'center', padding: '0 24px', gap: 16, flexShrink: 0,
    }}>
      <button onClick={onToggleSidebar} title="Toggle sidebar" style={{
        width: 32, height: 32, border: 0, background: 'transparent', color: 'var(--ink-2)',
        borderRadius: 6, cursor: 'pointer', display: 'grid', placeItems: 'center',
      }}><Icon name="org" size={18}/></button>

      <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
        {crumbs.map((c, i) => (
          <React.Fragment key={i}>
            {i > 0 && <Icon name="chevron-right" size={14} style={{ color: 'var(--ink-3)' }}/>}
            <span style={{ fontSize: 14, fontWeight: 600, color: 'var(--ink-1)', fontFamily: 'var(--font-serif)', letterSpacing: -0.1 }}>{c}</span>
          </React.Fragment>
        ))}
      </div>

      <div style={{ flex: 1 }}/>

      <div style={{
        display: 'flex', alignItems: 'center', gap: 8,
        background: 'var(--surface)', border: '1px solid var(--border)',
        borderRadius: 8, padding: '7px 12px', width: 280, color: 'var(--ink-3)',
      }}>
        <Icon name="search" size={15}/>
        <input placeholder="Search people, leaves, timesheets…" style={{
          border: 0, background: 'transparent', outline: 'none', flex: 1,
          fontSize: 13, color: 'var(--ink-1)', fontFamily: 'var(--font-sans)',
        }}/>
        <kbd style={{
          fontSize: 10, color: 'var(--ink-3)', background: 'var(--card)',
          padding: '2px 5px', borderRadius: 4, border: '1px solid var(--border)',
        }}>⌘K</kbd>
      </div>

      <button style={iconBtn} title="Notifications">
        <Icon name="bell" size={17}/>
        <span style={{
          position: 'absolute', top: 6, right: 7, width: 7, height: 7,
          borderRadius: '50%', background: 'var(--accent)', border: '2px solid var(--card)',
        }}/>
      </button>

      <button onClick={onToggleTweaks} style={{ ...iconBtn }} title="Tweaks">
        <Icon name="tweaks" size={17}/>
      </button>

      <div style={{ width: 1, height: 28, background: 'var(--border)' }}/>

      <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
        <Avatar emp={currentUser} size={32}/>
        <div style={{ display: 'flex', flexDirection: 'column' }}>
          <span style={{ fontSize: 13, fontWeight: 600, color: 'var(--ink-1)' }}>
            {currentUser.first} {currentUser.last}
          </span>
          <span style={{ fontSize: 11, color: 'var(--ink-3)', textTransform: 'capitalize', letterSpacing: 0.3 }}>{role}</span>
        </div>
      </div>

      <button onClick={onSignOut} title="Sign out" style={{ ...iconBtn, marginLeft: 4 }}>
        <Icon name="logout" size={16}/>
      </button>
    </header>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
